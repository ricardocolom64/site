name: Deploy to VPS

# Deploys are manual: merge into main, then run this workflow from the Actions tab.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SITE_DIR: /var/www/vhosts/site
      KEEP_RELEASES: 5

    steps:
    - name: Only deploy from main
      if: github.ref != 'refs/heads/main'
      run: |
        echo "::error::Deploys only run from main (this run is on '$GITHUB_REF_NAME')."
        exit 1

    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Build
      run: |
        npm ci
        npm run types
        npm run build

    # The host key is pinned in a secret rather than fetched with ssh-keyscan on
    # each run, so a deploy can't be redirected to an impostor server.
    - name: Setup SSH key
      env:
        KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
      run: |
        if [ -z "$KNOWN_HOSTS" ]; then
          echo "::error::The SERVER_KNOWN_HOSTS secret is not set."
          exit 1
        fi
        mkdir -p ~/.ssh
        echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts

    - name: Upload release
      env:
        TARGET: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
      run: |
        release="$SITE_DIR/releases/$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
        echo "RELEASE=$release" >> "$GITHUB_ENV"
        ssh "$TARGET" "mkdir -p '$release'"
        rsync -az --delete dist/client/ "$TARGET:$release/"

    - name: Publish release
      env:
        TARGET: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
      run: |
        ssh "$TARGET" bash -s -- "$SITE_DIR" "$RELEASE" "$KEEP_RELEASES" <<'EOF'
        set -euo pipefail
        site_dir="$1" release="$2" keep="$3"

        # Swap the symlink atomically so nginx never sees a missing `current`.
        ln -sfn "$release" "$site_dir/current.next"
        mv -Tf "$site_dir/current.next" "$site_dir/current"

        # Newest first, so the release just published is always kept.
        cd "$site_dir/releases"
        ls -1t | tail -n +$((keep + 1)) | xargs -r rm -rf --
        EOF
